<!DOCTYPE html>
<html>
<head><title>WS Test</title></head>
<body style="font-family: sans-serif; max-width: 500px; margin: 40px auto;">
  <h3>WebSocket test</h3>
  <label>JWT token: <input id="token" style="width: 100%"></label><br><br>
  <label>Conversation ID: <input id="convId" value="1"></label>
  <button onclick="connect()">Connect</button><br><br>
  <input id="msg" style="width: 70%" placeholder="type a message">
  <button onclick="send()">Send</button>
  <div id="log" style="margin-top: 20px; border: 1px solid #ccc; padding: 10px; height: 200px; overflow-y: auto;"></div>

  <br>
  <input type="file" id="fileInput">
  <button onclick="uploadFile()">Upload</button>

  <script>
    let ws, presenceWs;

    function log(text) {
      document.getElementById('log').innerHTML += `<div>${text}</div>`;
    }

    function connect() {
      const token = document.getElementById('token').value;
      const convId = document.getElementById('convId').value;

      ws = new WebSocket(`ws://127.0.0.1:8000/ws/conversations/${convId}?token=${token}`);
      ws.onopen = () => log('conversation socket: connected');
      ws.onclose = (e) => log('conversation socket: closed ' + e.code);
      ws.onmessage = (event) => {
        const m = JSON.parse(event.data);
        if (m.attachment_url) {
          log(`<b>${m.sender_username}:</b> ${m.content} <a href="${m.attachment_url}" target="_blank">[${m.attachment_type}]</a>`);
        } else {
          log(`<b>${m.sender_username}:</b> ${m.content}`);
        }
      };

      presenceWs = new WebSocket(`ws://127.0.0.1:8000/ws/presence?token=${token}`);
      presenceWs.onopen = () => log('presence socket: connected');
      presenceWs.onclose = (e) => log('presence socket: closed ' + e.code);
      presenceWs.onmessage = (event) => {
        const p = JSON.parse(event.data);
        log(`<i>presence: ${p.username} is ${p.online ? 'ONLINE' : 'OFFLINE'}</i>`);
      };
    }

    function send() {
      const content = document.getElementById('msg').value;
      ws.send(JSON.stringify({content}));
      document.getElementById('msg').value = '';
    }

    async function uploadFile() {
      const token = document.getElementById('token').value;
      const convId = document.getElementById('convId').value;
      const file = document.getElementById('fileInput').files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('file', file);
      formData.append('caption', '');

      const res = await fetch(`http://127.0.0.1:8000/conversations/${convId}/messages/upload`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` },
        body: formData,
      });
      const data = await res.json();
      log(`(you uploaded: <a href="${data.attachment_url}" target="_blank">${data.attachment_type}</a>)`);
    }
  </script>
</body>
</html>
